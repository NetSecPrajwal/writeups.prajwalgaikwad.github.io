<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}"/>
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"/>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="nav-logo">
      pg<span>/</span>writes
    </a>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Posts</a></li>
      <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains 'about' %}class="active"{% endif %}>About</a></li>
      <li><a href="{{ site.author.portfolio }}" target="_blank" rel="noopener">Portfolio ↗</a></li>
      <li><a href="{{ site.author.github }}" target="_blank" rel="noopener">GitHub ↗</a></li>
    </ul>
  </div>
</nav>

<main>{{ content }}</main>

<footer>
  <div class="footer-inner">
    <p>© {{ 'now' | date: '%Y' }} {{ site.author.name }} — {{ site.tagline }}</p>
    <div class="footer-links">
      <a href="{{ site.author.github }}" target="_blank">GitHub</a>
      <a href="{{ site.author.twitter }}" target="_blank">X</a>
      <a href="{{ site.author.portfolio }}" target="_blank">Portfolio</a>
    </div>
  </div>
</footer>

<script>
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible') });
}, { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
